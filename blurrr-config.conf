var body = $response.body;
var url = $request.url;

try {
    var obj = JSON.parse(body);
    
    console.log("=== Blurrr Premium Unlock (Safe) ===");
    console.log("URL: " + url);
    
    // Only modify payWalls - minimal change
    if (obj.blurrrVersion) {
        var blurrrConfig = JSON.parse(obj.blurrrVersion);
        
        // Disable ONLY paywalls - keep everything else intact
        if (blurrrConfig.payWalls) {
            // Set isOpen to 0 (disabled)
            blurrrConfig.payWalls.isOpen = 0;
            
            // Global launch paywall
            if (blurrrConfig.payWalls.global && blurrrConfig.payWalls.global.launch) {
                blurrrConfig.payWalls.global.launch.isOpen = 0;
            }
            
            // Global createProject paywall
            if (blurrrConfig.payWalls.global && blurrrConfig.payWalls.global.createProject) {
                blurrrConfig.payWalls.global.createProject.isOpen = 0;
            }
            
            // Local CN launch
            if (blurrrConfig.payWalls.local && blurrrConfig.payWalls.local.CN && blurrrConfig.payWalls.local.CN.launch) {
                blurrrConfig.payWalls.local.CN.launch.isOpen = 0;
            }
            
            // Local CN createProject
            if (blurrrConfig.payWalls.local && blurrrConfig.payWalls.local.CN && blurrrConfig.payWalls.local.CN.createProject) {
                blurrrConfig.payWalls.local.CN.createProject.isOpen = 0;
            }
        }
        
        // Disable monthly SVIP promotion popup
        if (blurrrConfig.salesPromotionConfig) {
            blurrrConfig.salesPromotionConfig.monthlySVIPIsOpen = false;
        }
        
        // Convert back
        obj.blurrrVersion = JSON.stringify(blurrrConfig);
    }
    
    body = JSON.stringify(obj);
    
    console.log("Modified Response");
    console.log("=== Blurrr Unlock End ===");
    
} catch(e) {
    console.log("Error: " + e);
    // Return original response on error
    body = $response.body;
}

$done({body});
